[build-system]
requires = ["setuptools >= 70"]
build-backend = "setuptools.build_meta"

[project]
name = "ligotools"
authors = [
  { name="Ligo Scientific Collaboration (LSC) and Eden Lange", email="elange017@berkeley.edy" },
]
description = "A ligotools installable package"
readme = "README.md"

requires-python = ">=3.9"
dependencies = [
    "tqdm",
	"numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "ipython",
	"ipykernel",
	"decorator"
]

license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

keywords = ["tools"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/UCB-stat-159-f25/hw3-elange017"

[tool.setuptools]
packages = ["ligotools"]
